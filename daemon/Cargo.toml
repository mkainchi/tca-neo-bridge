[package]
name = "neo-daemon"
version = "0.2.0"
edition = "2021"
publish = false
description = "Tray daemon that presents a Thrustmaster TCA Sidestick + Quadrant as a virtual T.Flight Hotas NEO"
license = "MIT"
repository = "https://github.com/mkainchi/tca-neo-bridge"

[lib]
name = "neo_daemon"
path = "src/lib.rs"

[[bin]]
name = "neo-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
