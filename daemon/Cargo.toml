[package]
name = "neo-daemon"
version = "0.3.0-experimental.2"
edition = "2021"
publish = false
description = "Experimental tray daemon that presents a Thrustmaster HOTAS as a virtual T.Flight Hotas NEO"
license = "MIT"
repository = "https://github.com/mkainchi/tca-neo-bridge"

[lib]
name = "neo_daemon"
path = "src/lib.rs"

[[bin]]
name = "neo-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
panic = "abort"
