name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchains
        shell: pwsh
        run: |
          rustup component add clippy llvm-tools-preview
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Lint and 100% coverage gates
        shell: pwsh
        run: ./scripts/check.ps1

  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install WDK 10.0.26100
        shell: pwsh
        run: |
          $stub = 'C:\Program Files (x86)\Windows Kits\10\Lib\wdf\umdf\x64\2.33\WdfDriverStubUm.lib'
          if (Test-Path $stub) { exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne 'ED82C46BD98E0F1D07FD6E5075900E42AEDC3FA5E68C06A8764B3DC5303CFF1B') { throw 'wdksetup.exe hash mismatch' }
          $p = Start-Process $setup -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\wdk.log" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { Get-Content "$env:RUNNER_TEMP\wdk.log" -Tail 50; throw "wdksetup failed ($($p.ExitCode))" }
          if (-not (Test-Path $stub)) { throw 'WDK installed but UMDF 2.33 stub library is missing' }
      - name: Build driver package
        shell: pwsh
        run: ./driver/build.ps1
