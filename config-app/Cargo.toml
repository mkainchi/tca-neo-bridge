[package]
name = "neo-config"
version = "0.3.0"
edition = "2021"
publish = false
description = "Configuration app for the TCA-NEO bridge: a native window over the daemon's loopback API"
license = "MIT"
repository = "https://github.com/mkainchi/tca-neo-bridge"

[lib]
name = "neo_config"
path = "src/lib.rs"

[[bin]]
name = "neo-config"
path = "src/main.rs"

[dependencies]
neo-common = { path = "../common" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu_no_default_features"] }
png = "0.18"
resvg = { version = "0.45", default-features = false, features = ["text"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
neo-daemon = { path = "../daemon" }
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu", "snapshot"] }

[build-dependencies]
embed-resource = "3.0"
